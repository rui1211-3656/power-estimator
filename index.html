<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1F1E;
    --card:#262A29;
    --border:#3A3F3D;
    --ink:#F3EFE7;
    --ink-dim:#9CA39F;
    --accent:#F2B705;
    --climb:#E4572E;
    --air:#4F86C6;
    --roll:#B08A55;
    --drive:#6B6B6B;
    --good:#5FB78C;
    --bad:#E4572E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:24px 16px 48px;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:440px;
  }
  .hero{
    text-align:center;
    padding:8px 0 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .hero .label{
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .hero .power{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:64px;
    line-height:1;
    color:var(--accent);
    letter-spacing:-0.01em;
  }
  .hero .power span{font-size:24px; font-weight:500; margin-left:4px; color:var(--ink);}
  .hero .pwr{
    margin-top:8px;
    font-family:'Oswald',sans-serif;
    font-size:20px;
    color:var(--ink);
  }
  .hero .pwr b{color:var(--accent); font-weight:600;}

  .subgrid{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-top:14px;
  }
  .subgrid .item{text-align:center;}
  .subgrid .item .v{font-family:'Oswald',sans-serif; font-size:22px; font-weight:500;}
  .subgrid .item .k{font-size:11px; color:var(--ink-dim); margin-top:2px;}

  .bar{
    display:flex;
    height:10px;
    border-radius:5px;
    overflow:hidden;
    margin:18px 0 8px;
    background:#141615;
  }
  .bar div{height:100%;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:22px;
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:14px;
    margin:0 0 14px;
    color:var(--ink-dim);
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  .row:last-child{margin-bottom:0;}
  .field{display:flex; flex-direction:column;}
  .field.wide{grid-column:1 / -1;}
  .field label{font-size:12px; color:var(--ink-dim); margin-bottom:5px;}
  .field .inputline{display:flex; align-items:center; gap:6px;}
  .field input[type=number]{
    width:100%;
    background:#1A1D1C;
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-size:16px;
    padding:8px 8px;
    -moz-appearance:textfield;
  }
  .field input[type=number]::-webkit-outer-spin-button,
  .field input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .unit{font-size:12px; color:var(--ink-dim); white-space:nowrap;}

  .foot{
    text-align:center;
    font-size:11px;
    color:var(--ink-dim);
    margin-top:8px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="label">推定パワー</div>
    <div class="power" id="outPower">0<span>W</span></div>
    <div class="pwr">PWR <b id="outPWR">0.00</b> W/kg</div>
    <div class="subgrid">
      <div class="item"><div class="v" id="outGrade">0.0%</div><div class="k">勾配</div></div>
      <div class="item"><div class="v" id="outSpeed">0.0</div><div class="k">時速 km/h</div></div>
    </div>
  </div>

  <div class="bar" id="bar"></div>
  <div class="legend">
    <span><i style="background:var(--climb)"></i>登坂 <b id="legClimb">0W</b></span>
    <span><i style="background:var(--air)"></i>空気 <b id="legAir">0W</b></span>
    <span><i style="background:var(--roll)"></i>転がり
