<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1F1E;
    --card:#262A29;
    --border:#3A3F3D;
    --ink:#F3EFE7;
    --ink-dim:#9CA39F;
    --accent:#F2B705;
    --climb:#E4572E;
    --air:#4F86C6;
    --roll:#B08A55;
    --drive:#6B6B6B;
    --good:#5FB78C;
    --bad:#E4572E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:24px 16px 48px;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:440px;
  }
  .hero{
    text-align:center;
    padding:8px 0 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .hero .label{
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .hero .power{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:64px;
    line-height:1;
    color:var(--accent);
    letter-spacing:-0.01em;
  }
  .hero .power span{font-size:24px; font-weight:500; margin-left:4px; color:var(--ink);}
  .hero .pwr{
    margin-top:8px;
    font-family:'Oswald',sans-serif;
    font-size:20px;
    color:var(--ink);
  }
  .hero .pwr b{color:var(--accent); font-weight:600;}

  .subgrid{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-top:14px;
  }
  .subgrid .item{text-align:center;}
  .subgrid .item .v{font-family:'Oswald',sans-serif; font-size:22px; font-weight:500;}
  .subgrid .item .k{font-size:11px; color:var(--ink-dim); margin-top:2px;}

  .bar{
    display:flex;
    height:10px;
    border-radius:5px;
    overflow:hidden;
    margin:18px 0 8px;
    background:#141615;
  }
  .bar div{height:100%;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:22px;
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:14px;
    margin:0 0 14px;
    color:var(--ink-dim);
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  .row:last-child{margin-bottom:0;}
  .field{display:flex; flex-direction:column;}
  .field.wide{grid-column:1 / -1;}
  .field label{font-size:12px; color:var(--ink-dim); margin-bottom:5px;}
  .field .inputline{display:flex; align-items:center; gap:6px;}
  .field input[type=number]{
    width:100%;
    background:#1A1D1C;
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-size:16px;
    padding:8px 8px;
    -moz-appearance:textfield;
  }
  .field input[type=number]::-webkit-outer-spin-button,
  .field input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field input[type=text]{
    width:100%;
    background:#1A1D1C;
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px 8px;
  }
  .unit{font-size:12px; color:var(--ink-dim); white-space:nowrap;}

  .savebar{
    display:flex;
    justify-content:center;
    margin:14px 0 22px;
  }
  .savebtn{
    background:var(--accent);
    color:#1C1F1E;
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .savebtn:active{opacity:0.8;}

  .tablewrap{
    overflow-x:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    white-space:nowrap;
  }
  th, td{
    padding:8px 6px;
    text-align:right;
    border-bottom:1px solid var(--border);
  }
  th:first-child, td:first-child{text-align:left;}
  th{
    color:var(--ink-dim);
    font-weight:500;
    cursor:pointer;
    user-select:none;
  }
  th.sorted{color:var(--accent);}
  td.del{
    text-align:center;
    color:var(--ink-dim);
    cursor:pointer;
  }
  .empty-log{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
    padding:12px 0;
  }

  .target{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .target .t-left{font-size:13px; color:var(--ink-dim);}
  .target .t-right{
    font-family:'Oswald',sans-serif;
    font-size:18px;
    text-align:right;
  }
  .target .t-right b{font-weight:600;}
  .diff-good{color:var(--good);}
  .diff-bad{color:var(--bad);}
  .hidden{display:none;}

  .foot{
    text-align:center;
    font-size:11px;
    color:var(--ink-dim);
    margin-top:8px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="label">推定パワー</div>
    <div class="power" id="outPower">0<span>W</span></div>
    <div class="pwr">PWR <b id="outPWR">0.00</b> W/kg</div>
    <div class="subgrid">
      <div class="item"><div class="v" id="outGrade">0.0%</div><div class="k">勾配</div></div>
      <div class="item"><div class="v" id="outSpeed">0.0</div><div class="k">時速 km/h</div></div>
    </div>
  </div>

  <div class="bar" id="bar"></div>
  <div class="legend">
    <span><i style="background:var(--climb)"></i>登坂 <b id="legClimb">0W</b></span>
    <span><i style="background:var(--air)"></i>空気 <b id="legAir">0W</b></span>
    <span><i style="background:var(--roll)"></i>転がり <b id="legRoll">0W</b></span>
    <span><i style="background:var(--drive)"></i>駆動 <b id="legDrive">0W</b></span>
  </div>

  <div class="savebar">
    <button class="savebtn" id="saveBtn">この結果を記録に追加</button>
  </div>

  <div class="card">
    <h2>コース条件</h2>
    <div class="row">
      <div class="field wide">
        <label>峠の名前（任意）</label>
        <div class="inputline"><input type="text" id="climbName" placeholder="例：〇〇峠"></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>距離</label>
        <div class="inputline"><input type="number" id="distance" step="0.01" value="0"><span class="unit">km</span></div>
      </div>
      <div class="field">
        <label>標高差</label>
        <div class="inputline"><input type="number" id="elevation" step="1" value="0"><span class="unit">m</span></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>タイム（分）</label>
        <div class="inputline"><input type="number" id="timeMin" step="1" value="0"><span class="unit">分</span></div>
      </div>
      <div class="field">
        <label>タイム（秒）</label>
        <div class="inputline"><input type="number" id="timeSec" step="1" value="0"><span class="unit">秒</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>ライダー・環境条件</h2>
    <div class="row">
      <div class="field">
        <label>体重</label>
        <div class="inputline"><input type="number" id="bodyWeight" step="0.1" value="62"><span class="unit">kg</span></div>
      </div>
      <div class="field">
        <label>バイク＋装備重量</label>
        <div class="inputline"><input type="number" id="gearWeight" step="0.1" value="10"><span class="unit">kg</span></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>気温</label>
        <div class="inputline"><input type="number" id="temp" step="1" value="20"><span class="unit">℃</span></div>
      </div>
      <div class="field">
        <label>CdA（夏 0.3 ／ 冬 0.4 目安）</label>
        <div class="inputline"><input type="number" id="cda" step="0.01" value="0.3"><span class="unit">m²</span></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Crr（タイヤ転がり係数）</label>
        <div class="inputline"><input type="number" id="crr" step="0.0005" value="0.003"><span class="unit"></span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>記録一覧</h2>
    <div class="tablewrap">
      <table id="logTable">
        <thead>
          <tr>
            <th data-key="name">峠</th>
            <th data-key="distance">距離</th>
            <th data-key="elevation">標高差</th>
            <th data-key="time">タイム</th>
            <th data-key="power">パワー</th>
            <th data-key="pwr">PWR</th>
            <th data-key="grade">勾配</th>
            <th data-key="speed">時速</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
    <div class="empty-log" id="emptyLog">まだ記録がありません</div>
  </div>

  <div class="foot">駆動抵抗は登坂・空気・転がり抵抗の合計の3%として概算。パワーは体重＋バイク＋装備の総重量で計算し、PWRは体重のみで算出。</div>

</div>

<script>
  const els = {
    climbName: document.getElementById('climbName'),
    distance: document.getElementById('distance'),
    elevation: document.getElementById('elevation'),
    timeMin: document.getElementById('timeMin'),
    timeSec: document.getElementById('timeSec'),
    bodyWeight: document.getElementById('bodyWeight'),
    gearWeight: document.getElementById('gearWeight'),
    temp: document.getElementById('temp'),
    cda: document.getElementById('cda'),
    crr: document.getElementById('crr'),
  };

  function num(el){ const v = parseFloat(el.value); return isNaN(v) ? 0 : v; }

  let lastResult = null;

  function calc(){
    const distanceKm = num(els.distance);
    const elevationM = num(els.elevation);
    const tMin = num(els.timeMin);
    const tSec = num(els.timeSec);
    const bodyWeight = num(els.bodyWeight);
    const gearWeight = num(els.gearWeight);
    const totalWeight = bodyWeight + gearWeight;
    const temp = num(els.temp);
    const cda = num(els.cda);
    const crr = num(els.crr);

    const totalSec = tMin * 60 + tSec;
    const airDensity = 1.285 * 273 / (273 + temp);

    let climb = 0, air = 0, roll = 0, drive = 0, power = 0, pwr = 0, grade = 0, speed = 0;

    if (totalSec > 0 && totalWeight > 0) {
      const v = distanceKm * 1000 / totalSec; // m/s
      climb = elevationM / totalSec * 9.8 * totalWeight;
      air = 0.5 * airDensity * cda * Math.pow(v, 3);
      roll = crr * totalWeight * 9.8 * v;
      drive = (climb + air + roll) * 0.03;
      power = climb + air + roll + drive;
      pwr = bodyWeight > 0 ? power / bodyWeight : 0;
      speed = 3600 * distanceKm / totalSec;
    }
    if (distanceKm > 0) {
      grade = elevationM / distanceKm / 10;
    }

    document.getElementById('outPower').innerHTML = Math.round(power) + '<span>W</span>';
    document.getElementById('outPWR').textContent = pwr.toFixed(2);
    document.getElementById('outGrade').textContent = grade.toFixed(1) + '%';
    document.getElementById('outSpeed').textContent = speed.toFixed(1);

    document.getElementById('legClimb').textContent = Math.round(climb) + 'W';
    document.getElementById('legAir').textContent = Math.round(air) + 'W';
    document.getElementById('legRoll').textContent = Math.round(roll) + 'W';
    document.getElementById('legDrive').textContent = Math.round(drive) + 'W';

    const bar = document.getElementById('bar');
    bar.innerHTML = '';
    const parts = [
      { v: Math.max(climb,0), c: 'var(--climb)' },
      { v: Math.max(air,0), c: 'var(--air)' },
      { v: Math.max(roll,0), c: 'var(--roll)' },
      { v: Math.max(drive,0), c: 'var(--drive)' },
    ];
    const sum = parts.reduce((a,b)=>a+b.v,0) || 1;
    parts.forEach(p=>{
      const seg = document.createElement('div');
      seg.style.width = (p.v/sum*100) + '%';
      seg.style.background = p.c;
      bar.appendChild(seg);
    });

    lastResult = {
      name: document.getElementById('climbName').value.trim(),
      distance: distanceKm,
      elevation: elevationM,
      timeSec: totalSec,
      power: power,
      pwr: pwr,
      grade: grade,
      speed: speed,
    };
  }

  Object.entries(els).forEach(([key, el]) => {
    el.addEventListener('input', () => {
      calc();
      saveValues();
    });
  });
  loadValues();
  calc();

  function saveValues(){
    const data = {};
    Object.entries(els).forEach(([key, el]) => { data[key] = el.value; });
    try { localStorage.setItem('powerEstimatorValues', JSON.stringify(data)); } catch(e) {}
  }

  function loadValues(){
    try {
      const raw = localStorage.getItem('powerEstimatorValues');
      if (!raw) return;
      const data = JSON.parse(raw);
      Object.entries(els).forEach(([key, el]) => {
        if (data[key] !== undefined) el.value = data[key];
      });
    } catch(e) {}
  }

  // --- 記録一覧 ---
  let log = [];
  let sortKey = null;
  let sortAsc = true;

  function loadLog(){
    try {
      const raw = localStorage.getItem('powerEstimatorLog');
      log = raw ? JSON.parse(raw) : [];
    } catch(e) { log = []; }
  }

  function saveLog(){
    try { localStorage.setItem('powerEstimatorLog', JSON.stringify(log)); } catch(e) {}
  }

  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function renderLog(){
    const body = document.getElementById('logBody');
    const emptyEl = document.getElementById('emptyLog');
    let rows = log.slice();

    if (sortKey) {
      rows.sort((a, b) => {
        let av = a[sortKey], bv = b[sortKey];
        if (sortKey === 'name') {
          av = (av || '').toLowerCase(); bv = (bv || '').toLowerCase();
          return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        }
        return sortAsc ? av - bv : bv - av;
      });
    }

    body.innerHTML = '';
    if (rows.length === 0) {
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
    }

    rows.forEach(entry => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + (entry.name || '（無題）') + '</td>' +
        '<td>' + entry.distance.toFixed(2) + 'km</td>' +
        '<td>' + Math.round(entry.elevation) + 'm</td>' +
        '<td>' + formatTime(entry.timeSec) + '</td>' +
        '<td>' + Math.round(entry.power) + 'W</td>' +
        '<td>' + entry.pwr.toFixed(2) + '</td>' +
        '<td>' + entry.grade.toFixed(1) + '%</td>' +
        '<td>' + entry.speed.toFixed(1) + '</td>' +
        '<td class="del" data-id="' + entry.id + '">✕</td>';
      body.appendChild(tr);
    });

    document.querySelectorAll('#logTable th[data-key]').forEach(th => {
      th.classList.toggle('sorted', th.dataset.key === sortKey);
    });
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!lastResult || lastResult.timeSec <= 0 || lastResult.distance <= 0) return;
    log.push(Object.assign({ id: Date.now() + '-' + Math.random().toString(36).slice(2) }, lastResult));
    saveLog();
    renderLog();
  });

  document.querySelectorAll('#logTable th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) { sortAsc = !sortAsc; } else { sortKey = key; sortAsc = true; }
      renderLog();
    });
  });

  document.getElementById('logBody').addEventListener('click', (e) => {
    if (e.target.classList.contains('del')) {
      const id = e.target.dataset.id;
      log = log.filter(entry => entry.id !== id);
      saveLog();
      renderLog();
    }
  });

  loadLog();
  renderLog();
</script>
</body>
</html>
