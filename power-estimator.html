<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1F1E;
    --card:#262A29;
    --border:#3A3F3D;
    --ink:#F3EFE7;
    --ink-dim:#9CA39F;
    --accent:#F2B705;
    --climb:#E4572E;
    --air:#4F86C6;
    --roll:#B08A55;
    --drive:#6B6B6B;
    --good:#5FB78C;
    --bad:#E4572E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:24px 16px 48px;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:440px;
  }
  .hero{
    text-align:center;
    padding:8px 0 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .hero .label{
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .hero .power{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:64px;
    line-height:1;
    color:var(--accent);
    letter-spacing:-0.01em;
  }
  .hero .power span{font-size:24px; font-weight:500; margin-left:4px; color:var(--ink);}
  .hero .pwr{
    margin-top:8px;
    font-family:'Oswald',sans-serif;
    font-size:20px;
    color:var(--ink);
  }
  .hero .pwr b{color:var(--accent); font-weight:600;}

  .subgrid{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-top:14px;
  }
  .subgrid .item{text-align:center;}
  .subgrid .item .v{font-family:'Oswald',sans-serif; font-size:22px; font-weight:500;}
  .subgrid .item .k{font-size:11px; color:var(--ink-dim); margin-top:2px;}

  .bar{
    display:flex;
    height:10px;
    border-radius:5px;
    overflow:hidden;
    margin:18px 0 8px;
    background:#141615;
  }
  .bar div{height:100%;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:22px;
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:14px;
    margin:0 0 14px;
    color:var(--ink-dim);
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  .row:last-child{margin-bottom:0;}
  .field{display:flex; flex-direction:column;}
  .field.wide{grid-column:1 / -1;}
  .field label{font-size:12px; color:var(--ink-dim); margin-bottom:5px;}
  .field .inputline{display:flex; align-items:center; gap:6px;}
  .field input[type=number]{
    width:100%;
    background:#1A1D1C;
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-size:16px;
    padding:8px 8px;
    -moz-appearance:textfield;
  }
  .field input[type=number]::-webkit-outer-spin-button,
  .field input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .unit{font-size:12px; color:var(--ink-dim); white-space:nowrap;}

  .target{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .target .t-left{font-size:13px; color:var(--ink-dim);}
  .target .t-right{
    font-family:'Oswald',sans-serif;
    font-size:18px;
    text-align:right;
  }
  .target .t-right b{font-weight:600;}
  .diff-good{color:var(--good);}
  .diff-bad{color:var(--bad);}
  .hidden{display:none;}

  .foot{
    text-align:center;
    font-size:11px;
    color:var(--ink-dim);
    margin-top:8px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="label">推定パワー</div>
    <div class="power" id="outPower">0<span>W</span></div>
    <div class="pwr">PWR <b id="outPWR">0.00</b> W/kg</div>
    <div class="subgrid">
      <div class="item"><div class="v" id="outGrade">0.0%</div><div class="k">勾配</div></div>
      <div class="item"><div class="v" id="outSpeed">0.0</div><div class="k">時速 km/h</div></div>
    </div>
  </div>

  <div class="bar" id="bar"></div>
  <div class="legend">
    <span><i style="background:var(--climb)"></i>登坂 <b id="legClimb">0W</b></span>
    <span><i style="background:var(--air)"></i>空気 <b id="legAir">0W</b></span>
    <span><i style="background:var(--roll)"></i>転がり <b id="legRoll">0W</b></span>
    <span><i style="background:var(--drive)"></i>駆動 <b id="legDrive">0W</b></span>
  </div>

  <div class="card">
    <h2>コース条件</h2>
    <div class="row">
      <div class="field">
        <label>距離</label>
        <div class="inputline"><input type="number" id="distance" step="0.01" value="1.58"><span class="unit">km</span></div>
      </div>
      <div class="field">
        <label>標高差</label>
        <div class="inputline"><input type="number" id="elevation" step="1" value="120"><span class="unit">m</span></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>タイム（分）</label>
        <div class="inputline"><input type="number" id="timeMin" step="1" value="4"><span class="unit">分</span></div>
      </div>
      <div class="field">
        <label>タイム（秒）</label>
        <div class="inputline"><input type="number" id="timeSec" step="1" value="0"><span class="unit">秒</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>ライダー・環境条件</h2>
    <div class="row">
      <div class="field">
        <label>総重量（体重＋バイク）</label>
        <div class="inputline"><input type="number" id="weight" step="0.1" value="72"><span class="unit">kg</span></div>
      </div>
      <div class="field">
        <label>気温</label>
        <div class="inputline"><input type="number" id="temp" step="1" value="20"><span class="unit">℃</span></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>CdA（夏 0.3 ／ 冬 0.4 目安）</label>
        <div class="inputline"><input type="number" id="cda" step="0.01" value="0.3"><span class="unit">m²</span></div>
      </div>
      <div class="field">
        <label>Crr（タイヤ転がり係数）</label>
        <div class="inputline"><input type="number" id="crr" step="0.0005" value="0.003"><span class="unit"></span></div>
      </div>
    </div>
  </div>

  <div class="card" id="targetCard">
    <h2>目標パワーとの比較</h2>
    <div class="target">
      <div class="t-left" id="targetLabel">—</div>
      <div class="t-right" id="targetDiff">—</div>
    </div>
  </div>

  <div class="foot">駆動抵抗は登坂・空気・転がり抵抗の合計の3%として概算。PWRはバイクを含む諸装備を10kgとみなし、それを差し引いた体重換算。</div>

</div>

<script>
  const els = {
    distance: document.getElementById('distance'),
    elevation: document.getElementById('elevation'),
    timeMin: document.getElementById('timeMin'),
    timeSec: document.getElementById('timeSec'),
    weight: document.getElementById('weight'),
    temp: document.getElementById('temp'),
    cda: document.getElementById('cda'),
    crr: document.getElementById('crr'),
  };

  const targets = [
    { min: 5, watt: 410 },
    { min: 8, watt: 385 },
    { min: 10, watt: 375 },
    { min: 15, watt: 355 },
    { min: 20, watt: 340 },
  ];

  function num(el){ const v = parseFloat(el.value); return isNaN(v) ? 0 : v; }

  function calc(){
    const distanceKm = num(els.distance);
    const elevationM = num(els.elevation);
    const tMin = num(els.timeMin);
    const tSec = num(els.timeSec);
    const weight = num(els.weight);
    const temp = num(els.temp);
    const cda = num(els.cda);
    const crr = num(els.crr);

    const totalSec = tMin * 60 + tSec;
    const airDensity = 1.285 * 273 / (273 + temp);

    let climb = 0, air = 0, roll = 0, drive = 0, power = 0, pwr = 0, grade = 0, speed = 0;

    if (totalSec > 0 && weight > 0) {
      const v = distanceKm * 1000 / totalSec; // m/s
      climb = elevationM / totalSec * 9.8 * weight;
      air = 0.5 * airDensity * cda * Math.pow(v, 3);
      roll = crr * weight * 9.8 * v;
      drive = (climb + air + roll) * 0.03;
      power = climb + air + roll + drive;
      pwr = weight > 10 ? power / (weight - 10) : 0;
      speed = 3600 * distanceKm / totalSec;
    }
    if (distanceKm > 0) {
      grade = elevationM / distanceKm / 10;
    }

    document.getElementById('outPower').innerHTML = Math.round(power) + '<span>W</span>';
    document.getElementById('outPWR').textContent = pwr.toFixed(2);
    document.getElementById('outGrade').textContent = grade.toFixed(1) + '%';
    document.getElementById('outSpeed').textContent = speed.toFixed(1);

    document.getElementById('legClimb').textContent = Math.round(climb) + 'W';
    document.getElementById('legAir').textContent = Math.round(air) + 'W';
    document.getElementById('legRoll').textContent = Math.round(roll) + 'W';
    document.getElementById('legDrive').textContent = Math.round(drive) + 'W';

    const bar = document.getElementById('bar');
    bar.innerHTML = '';
    const parts = [
      { v: Math.max(climb,0), c: 'var(--climb)' },
      { v: Math.max(air,0), c: 'var(--air)' },
      { v: Math.max(roll,0), c: 'var(--roll)' },
      { v: Math.max(drive,0), c: 'var(--drive)' },
    ];
    const sum = parts.reduce((a,b)=>a+b.v,0) || 1;
    parts.forEach(p=>{
      const seg = document.createElement('div');
      seg.style.width = (p.v/sum*100) + '%';
      seg.style.background = p.c;
      bar.appendChild(seg);
    });

    // target comparison — nearest duration bucket within ±2min
    const totalMin = totalSec / 60;
    let nearest = null, nearestDiff = Infinity;
    targets.forEach(t=>{
      const d = Math.abs(t.min - totalMin);
      if (d < nearestDiff){ nearestDiff = d; nearest = t; }
    });

    const targetLabel = document.getElementById('targetLabel');
    const targetDiff = document.getElementById('targetDiff');
    const targetCard = document.getElementById('targetCard');

    if (nearest && nearestDiff <= 2 && totalSec > 0) {
      targetCard.classList.remove('hidden');
      const diff = power - nearest.watt;
      targetLabel.textContent = nearest.min + '分目標 ' + nearest.watt + 'W';
      const sign = diff >= 0 ? '+' : '';
      targetDiff.innerHTML = Math.round(power) + 'W <span class="' + (diff >= 0 ? 'diff-good' : 'diff-bad') + '">(' + sign + Math.round(diff) + ')</span>';
    } else {
      targetCard.classList.add('hidden');
    }
  }

  Object.values(els).forEach(el => el.addEventListener('input', calc));
  calc();
</script>
</body>
</html>
